name = "pdf-insight-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Served from *.workers.dev; per-version preview URLs are not needed.
workers_dev = true
preview_urls = false

[dev]
# Fixed so the web app (VITE_API_URL) and scripts/dev.mjs can rely on it.
port = 8787

# Secrets (MISTRAL_API_KEY, LLM_API_KEY) are set via `wrangler secret put`, never committed.
# For local development copy .dev.vars.example to .dev.vars.

[vars]
# Primary provider. Pinned Ministral 3 8B (v25.12): strict json_schema output and
# good Polish at ~11 s per analysis. On the free Experiment plan Mistral Small and
# Medium have a quota of 0, 14B takes ~40 s and 3B is less precise.
MISTRAL_MODEL = "ministral-8b-2512"
# Fallback provider (Gemini). Stable Flash model with structured JSON output,
# available on the free tier.
LLM_MODEL = "gemini-3.8-flash"
# Comma-separated, exact origins (scheme + host + optional port, no path).
ALLOWED_ORIGINS = "https://masterxxo.github.io,http://localhost:5173"
# Long documents: text above this many estimated tokens (~2.7 chars each) is
# analyzed in up to MAX_CHUNKS chunks, CHUNK_CONCURRENCY at a time, then merged.
SINGLE_CALL_MAX_TOKENS = "60000"
MAX_CHUNKS = "2"
CHUNK_CONCURRENCY = "2"

# Analysis results, keyed by a hash of the prompt and the document text (7-day TTL).
[[kv_namespaces]]
binding = "ANALYSIS_CACHE"
id = "163027fd78a24a859cba2e9688bba8bd"

# Per-IP limit for POST /analyze (5 requests/min), kept low for the free LLM plans.
# namespace_id must be unique within the account.
[[ratelimits]]
name = "ANALYZE_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
